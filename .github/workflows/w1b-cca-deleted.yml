name: W1B CCA deleted-comment probe
on:
  issue_comment:
    types: [deleted]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: event-identities
        run: |
          echo "event action    : ${{ github.event.action }}"
          echo "github.actor    : ${{ github.actor }}"
          echo "comment user    : ${{ github.event.comment.user.login }}"
          echo "comment body    : ${{ github.event.comment.body }}"
      - name: Run Claude Code (pinned 1d6de8c)
        id: claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
